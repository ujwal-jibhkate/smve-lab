[project]
name = "smve-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ujwal Jibhkate", email = "ujwaljibhkate@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "flagembedding>=1.4.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pystemmer>=3.1.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
smve-lab = "smve_lab:main"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
